.stat.main{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stat.main .lab,.stat.main .num small{color:inherit;opacity:.85}
.field-label{font-size:.8rem;color:var(--muted);margin:0 0 6px;letter-spacing:.04em}
.seg{display:flex;flex-wrap:wrap;gap:6px}

.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-size:1rem;width:100%}
.btn.ghost{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px}
.row>*{flex:1}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.chip{display:inline-block;border-radius:6px;padding:1px 8px;font-size:.75rem;background:var(--accent-soft);color:var(--ink);white-space:nowrap}

.progress{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-width:640px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.18)}

ない人がいる。しかし、何もしなけれ…","opts":["失敗しないことが最も大切だ。","失敗から何を学ぶかが大切だ。","失敗は成長と関係がない。","失敗しないように何もしないほうがいい。"],"tf":[false,true,false,false],"exp":["","","",""],"ans":[2],"point":"最後の文「大事なのは…失敗から何を学ぶかだ」が筆者の主張。","weak":false,"date":"新作","kind":""},{"id":"N2-114","lv":"N2","field":"読解","instr":"次の文章を読んで、質問に答えなさい。","stem":"田中様\n先日はお忙しい中、打ち合わせのお時間をいただき、ありがとうございました。ご提案いただいた内容を社内で検討し、来週の水曜日までにお返事いたします。なお、見積書は本日郵送いたしましたので、ご確認ください。\n\nこのメールを書いた人が、これからすることは何か。","topic":"読解：田中様","opts":["田中さんと打ち合わせをする。","来週の水曜日までに返事をする。","見積書の内容を確認する。","今日、見積書を郵送する。"],"tf":[false,true,false,false],"exp":["","","",""],"ans":[2],"point":"見積書は「本日郵送いたしました」（もう送った）。これからするのは返事。","weak":false,"date":"新作","kind":""},{"id":"N2-115","lv":"N2","field":"読解","instr":"次の文章を読んで、質問に答えなさい。","stem":"スマートフォンは便利だが、寝る前に使うと眠りが浅くなると言われている。画面の光が、眠気を起こすホルモンの働きを弱めるからだ。ぐっすり眠りたいなら、寝る1時間前には画面を見ないようにするとよい。\n\n寝る前にスマートフォンを使うとよくないのはなぜか。","topic":"読解：スマートフォンは便利だが、寝る前に使うと眠りが浅くな…","opts":["つい1時間以上使ってしまうから","電池がなくなってしまうから","目が疲れて痛くなるから","画面の光が、眠気を起こすホルモンの働きを弱めるから"],"tf":[false,false,false,true],"exp":["","","",""],"ans":[4],"point":"「〜からだ」の文が理由を表している。","weak":false,"date":"新作","kind":""},{"id":"N2-116","lv":"N2","field":"読解","instr":"次の文章を読んで、質問に答えなさい。","stem":"日本では、電車の中で電話で話すことはマナー違反とされている。周りの人に迷惑をかけないためだ。一方で、メールやメッセージを送ることは問題ないとされている。音が出ないからである。\n\n電車の中での電話がマナー違反とされるのはなぜか。","topic":"読解：日本では、電車の中で電話で話すことはマナー違反とされ…","opts":["周りの人の迷惑になるから","メールのほうが速いから","法律で禁止されているから","電車の中は電波が悪いから"],"tf":[true,false,false,false],"exp":["","","",""],"ans":[1],"point":"「周りの人に迷惑をかけないためだ」とある。","weak":false,"date":"新作","kind":""},{"id":"N2-117","lv":"N2","field":"読解","instr":"次の文章を読んで、質問に答えなさい。","stem":"当店では、ポイントカードをお持ちのお客様に、お買い物100円ごとに1ポイントを差し上げております。500ポイントたまると、500円分のお買い物券と交換できます。ただし、セール品はポイントの対象外です。\n\nこの文章の内容と合うものはどれか。","topic":"読解：当店では、ポイントカードをお持ちのお客様に、お買い物…","opts":["カードがなくても、ポイントがもらえる。","セール品を買っても、ポイントはもらえない。","1円ごとに1ポイントもらえる。","100ポイントで500円分のお買い物券と交換できる。"],"tf":[false,true,false,false],"exp":["","","",""],"ans":[2],"point":"「セール品はポイントの対象外」とある。","weak":f "とはいえ","どころか","ともなると"],"tf":[false,true,false,false],"exp":["","","",""],"ans":[2],"point":"〜とはいえ＝〜だけれども。","weak":false,"date":"新作","kind":""},{"id":"N1-110","lv":"N1","field":"文法","instr":"次の文の（　）に入れるのに最もよいものを選びなさい。","stem":"人気歌手が来る（　）、会場は大勢の人で埋まった。","topic":"文法：人気歌手が来る（　）、会場は大勢の人で埋まった。","opts":["とあって","とはいえ","といえども","ともなく"],"tf":[true,false,false,false],"exp":["","","",""],"ans":[1],"point":"〜とあって＝〜という特別な状況なので。","weak":false,"date":"新作","kind":""},{"id":"N1-111","lv":"N1","field":"読解","instr":"次の文章を読んで、質問に答えなさい。","stem":"情報があふれる現代では、知識を持っていること自体の価値は下がりつつある。調べればすぐに分かるからだ。むしろ求められているのは、膨大な情報の中から必要なものを選び、それをどう使うかを判断する力である。\n\n筆者によると、現代で求められている力は何か。","topic":"読解：情報があふれる現代では、知識を持っていること自体の価…","opts":["必要な情報を選び、使い方を判断する力","自分で情報を発信する力","たくさんの知識を覚えておく力","速く情報を調べる力"],"tf":[true,false,false,false],"exp":["","","",""],"ans":[1],"point":"「むしろ求められているのは〜力である」が答え。","weak":false,"date":"新作","kind":""},{"id":"N1-112","lv":"N1","field":"読解","instr":"次の文章を読んで、質問に答えなさい。","stem":"「便利さ」は、しばしば何かを失うことと引き換えに得られる。たとえば、移動が速くなるにつれて、途中の景色を楽しむ時間は減った。便利さを否定するつもりはないが、失ったものにも時には目を向けるべきではないだろうか。\n\n筆者の主張に最も近いものはどれか。","topic":"読解：「便利さ」は、しばしば何かを失うことと引き換えに得ら…","opts":["便利さの陰で失ったものにも目を向けるべきだ。","移動はもっと速くなるべきだ。","景色を楽しむ時間は増えている。","便利さは否定すべきだ。"],"tf":[true,false,false,false],"exp":["","","",""],"ans":[1],"point":"「〜べきではないだろうか」は筆者の主張を表す。便利さは否定していない。","weak":false,"date":"新作","kind":""},{"id":"N1-113","lv":"N1","field":"読解","instr":"次の文章を読んで、質問に答えなさい。","stem":"子どもに「頑張れ」と言うことは簡単だ。しかし、すでに精一杯頑張っている子どもにとって、その言葉は重荷になることもある。大人に必要なのは、結果だけを見て励ますことではなく、それまでの過程を認めることではないか。\n\n筆者は、大人に何が必要だと考えているか。","topic":"読解：子どもに「頑張れ」と言うことは簡単だ。しかし、すでに…","opts":["子どもの努力の過程を認めること","もっと「頑張れ」と言うこと","結果だけを見て評価すること","重荷にならないよう何も言わないこと"],"tf":[true,false,false,false],"exp":["","","",""],"ans":[1],"point":"「〜ではなく、〜ことではないか」の後半が筆者の考え。","weak":false,"date":"新作","kind":""},{"id":"N1-114","lv":"N1","field":"読解","instr":"次の文章を読んで、質問に答えなさい。","stem":"多数決は民主的な決め方だとされる。しかし、それは少数派の意見が十分に聞かれたうえで行われてこそ意味を持つ。議論を省いて数だけで決めるなら、それは単に多数派の意思を押し付けることにほかならない。\n\n筆者の考えに合うものはどれか。","topic":"読解：多数決は民主的な決め方だとされる。しかし、それは少数…","opts":["議論は時間の無駄なので、省くべきだ。","多数決は民主的ではないので、使うべきではない。","少数派の意見で物事を決めるべきだ。","多数決は、少数派の意見を十分に聞いてから行うべきだ。"],"tf":[false,false,false,true],"exp":["","","",""],"ans":[4],"point":"「〜てこそ意味を持つ」＝〜したときにだけ意味がある。","weak":false,"date":"新作","kind":""},{"id":"N1-115","lv":"N1","field":"読解","instr":"次の文章を読んで、質問に答えなさい。","stem":"翻訳は、ある言語の言葉を別の言語の言葉に置き換えるだけの作業ではない。言葉の背景にある文化や習慣までも理解しなければ、本当の意味は伝わらない。優れた翻訳者が「もう一人の作者」と呼ばれるのはそのためである。\n\n「そのため」とは何を指すか。","topic":"読解：翻訳は、ある言語の言葉を別の言語の言葉に置き換えるだ…","opts":["翻訳者がいくつもの言語を話せること","翻訳者が作品を自由に書き直すこと","翻訳は、言葉を置き換えるだけの作業であること","翻訳には、文化や習慣の理解まで必要であること"],"tf":[false,false,false,true],"exp":["","","",""],"ans":[4],"point":"直前の文の内容を指している。","weak":false,"date":"新作","kind":""},{"id":"N1-116","lv":"N1","field":"読解","instr":"次の文章を読んで、質問に答えなさい。","stem":"年を取ると新しいことを覚えにくくなると言われる。確かに記憶の速さは衰えるかもしれない。しかし、豊富な経験と結びつけることで、若い人以上に深く理解できることも少なくない。学ぶのに遅すぎるということはないのである。\n\n筆者の主張は何か。","topic":"読解：年を取ると新しいことを覚えにくくなると言われる。確か…","opts":["若い人のほうが、いつも深く理解できる。","年を取っても、経験を生かして深く学ぶことができる。","年を取ると、もう学ぶことはできない。","記憶の速さは年齢と関係がない。"],"tf":[false,true,false,false],"exp":["","","",""],"ans":[2],"point":"「確かに〜。しかし〜」の「しかし」の後が主張。","weak":false,"date":"新作","kind":""},{"id":"N1-117","lv":"N1","field":"読解","instr":"次の文章を読んで、質問に答えなさい。","stem":"失敗を隠す組織は、同じ失敗を繰り返す。報告すれば責められると分かっていれば、人は失敗を隠そうとするからだ。失敗を共有し、そこから学ぶ文化をつくることが、結果として組織を強くするのである。\n\n筆者によると、組織を強くするには何が必要か。","topic":"読解：失敗を隠す組織は、同じ失敗を繰り返す。報告すれば責め…","opts":["失敗しない人だけを採用すること","失敗した人を厳しく責めること","失敗を外部に知られないようにすること","失敗を共有し、そこから学ぶ文化をつくること"],"tf":[false,false,false,true],"exp":["","","",""],"ans":[4],"point":"最後の文が答え。","weak":false,"date":"新作","kind":""},{"id":"N1-118","lv":"N1","field":"読解","instr":"次の文章を読んで、質問に答えなさい。","stem":"「普通」という言葉ほどあいまいなものはない。ある人にとって普通のことが、別の人には特別なことである場合も多い。自分の「普通」を他人に当てはめようとするとき、私たちは知らず知らずのうちに誰かを傷つけているのかもしれない。\n\n筆者が言いたいことは何か。","topic":"読解：「普通」という言葉ほどあいまいなものはない。ある人に…","opts":["自分の「普通」を他人に押し付けないよう気をつけるべきだ。","「普通」の意味は誰にとっても同じだ。","特別なことはするべきではない。","他人を傷つけることは避けられない。"],"tf":[true,false,false,false],"exp":["","","",""],"ans":[1],"point":"「普通」は人によって違う、という主張。","weak":false,"date":"新作","kind":""},{"id":"N1-119","lv":"N1","field":"読解","instr":"次の文章を読んで、質問に答えなさい。","stem":"科学技術の進歩は、人間の生活を豊かにしてきた。一方で、その使い方を誤れば、取り返しのつかない被害をもたらすこともある。技術そのものに善悪はなく、問われているのは、それを扱う人間の判断なのである。\n\n筆者の考えに合うものはどれか。","topic":"読解：科学技術の進歩は、人間の生活を豊かにしてきた。一方で…","opts":["技術をどう使うかは、人間の判断にかかっている。","技術の進歩は生活を豊かにしなかった。","技術そのものが悪いものだ。","科学技術の進歩は止めるべきだ。"],"tf":[true,false,false,false],"exp":["","","",""],"ans":[1],"point":"「問われているのは、それを扱う人間の判断」とある。","weak":false,"date":"新作","kind":""},{"id":"N1-120","lv":"N1","field":"読解","instr":"次の文章を読んで、質問に答えなさい。","stem":"【社内通知】来月より在宅勤務制度を拡充します。これまで週1日までとしていた在宅勤務を、週3日まで認めます。ただし、新入社員は入社後3か月間は対象外とします。申請は、前週の金曜日までに上司に行ってください。\n\nこの通知の内容と合うものはどれか。","topic":"読解：【社内通知】来月より在宅勤務制度を拡充します。これま…","opts":["在宅勤務は来月から週1日までに制限される。","在宅勤務の申請は、前の週の金曜日までに上司に出す。","申請は在宅勤務をする日の朝に行えばよい。","新入社員も入社直後から週3日在宅勤務ができる。"],"tf":[false,true,false,false],"exp":["","","",""],"ans":[2],"point":"「申請は、前週の金曜日までに上司に」とある。","weak":false,"date":"新作","kind":""}],"glossary":{"にもかかわらず":"〜なのに。予想と違う結果に使う。例：雨にもかかわらず、試合は行われた。（N2）","くせに":"〜なのに（相手を非難する気持ち）。例：知っているくせに教えない。（N2）","ばかりか":"〜だけでなく…も。（N2）","おそれがある":"悪いことが起こる可能性がある。ニュースなどでよく使う。（N2）","すえに":"いろいろあって、最後に。例：悩んだすえに決めた。（N2）","わけにはいかない":"（事情があって）〜できない。「〜ないわけにはいかない」は「〜しなければならない」。（N2）","どころではない":"〜する余裕がない。（N2）","を問わず":"〜に関係なく。例：年齢を問わず参加できる。（N2）","に応じて":"〜に合わせて変わる。（N2）","をめぐって":"〜について（議論・対立など）。（N2）","をこめて":"気持ちを入れて。例：心をこめて書く。（N2）","に先立ち":"〜の前に（改まった言い方）。（N2）","をもとに":"〜を材料・基礎にして。（N2）","に反して":"〜とは逆に。例：予想に反して。（N2）","に伴い":"〜といっしょに変化して。（N2）","にかけては":"〜の分野では（いちばんだ）。（N2）","とは限らない":"いつも〜というわけではない。（N2）","に違いない":"きっと〜だ（強い推量）。（N2）","にすぎない":"ただ〜だけだ。（N2）","に限る":"〜がいちばんいい。（N2）","わけがない":"絶対に〜ない。（N2）","ものの":"〜けれども。（N2）","でさえ":"〜も（極端な例を出して）。（N1）","といえども":"〜であっても。（N1）","をもって":"〜で（区切り・手段を表す改まった言い方）。（N1）","ならでは":"〜だけが持つ特別な。例：京都ならではの景色。（N1）","をよそに":"〜を気にしないで。（N1）","にひきかえ":"〜とは反対に。（N1）","いかんでは":"〜によっては。（N1）","とあれば":"〜のためなら、〜というのなら。（N1）","ずくめ":"〜ばかり。例：いいことずくめ。（N1）","まみれ":"汗・泥など、よくないものが全体についている。（N1）","ぐるみ":"〜全体で。例：町ぐるみ。（N1）","ともあろう":"立派な立場の人が（そんなことをするとは）。（N1）","までもなく":"〜する必要もなく。（N1）","がてら":"〜のついでに。（N1）","そばから":"〜してもすぐに。（N1）","かたわら":"本業をしながら、その一方で。（N1）","に値する":"〜する価値がある。（N1）","に堪えない":"ひどくて〜できない。例：見るに堪えない。（N1）","に足る":"〜するだけの価値がある。（N1）","にかたくない":"簡単に〜できる。例：想像にかたくない。（N1）","をおいて":"「〜をおいてほかにない」＝〜以外にない。（N1）","を皮切りに":"〜を始まりとして。（N1）","とはいえ":"〜だけれども。（N1）","とあって":"〜という特別な状況なので。（N1）"}}</script>
<script>
(async function(){
let DATA;
try{DATA=JSON.parse(document.getElementById('data').textContent)}catch(e){
  try{DATA=await (await fetch('questions.json')).json()}catch(e2){document.getElementById('view').innerHTML='<div class="panel empty">問題を読み込めませんでした。通信の状態を確かめて、もう一度開いてください。</div>';return}
}
const Q=DATA.questions, GL=DATA.glossary;
const QBY={}; Q.forEach(q=>QBY[q.id]=q);
document.getElementById('qcount').textContent=Q.length;
const FIELDS=['漢字読み','表記','文脈規定','言い換え類義','用法','文法','読解'];
const FSHORT={'漢字読み':'漢字読み','表記':'表記','文脈規定':'文脈','言い換え類義':'言い換え','用法':'用法','文法':'文法','読解':'読解'};

/* ---- 一日一問（チャット）でこれまでに解いた結果。最初の1回だけ記録に取り込む ---- */
const HISTORY={};

/* ---------- utils ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pct=(c,n)=>n?Math.round(c/n*100):0;
const terms=Object.keys(GL).sort((a,b)=>b.length-a.length);
const termRe=new RegExp('('+terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','g');
function hl(s){return esc(s).replace(termRe,m=>'<button class="term" data-term="'+esc(m)+'">'+m+'</button>')}
const fmtStem=t=>esc(t).replace(/«(.*?)»/g,'<u>$1</u>').replace(/\n/g,'<br>');
const stemOf=q=>{const ins='<span class="note" style="display:block;margin-bottom:6px">'+esc(q.instr)+'</span>';
  if(q.field==='用法') return ins+'<b style="font-size:1.3rem">'+esc(q.stem)+'</b>';
  if(q.field==='読解'){const k=q.stem.lastIndexOf('\n\n');return ins+'<span style="display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:400;line-height:1.9;margin-bottom:10px">'+fmtStem(q.stem.slice(0,k))+'</span><b>'+fmtStem(q.stem.slice(k+2))+'</b>'}
  return ins+fmtStem(q.stem)};
function optRes(q,i,picked){
  const ok=q.tf[i];
  return `<div class="res ${ok?'ok':(picked?'ng':'')}"><div class="line"><span>${ok?'🟢':(picked?'🔴':'・')}</span><span>${i+1}. ${esc(q.opts[i])}</span>${ok?'<span class="you" style="color:var(--ok);font-weight:700">← 正解</span>':''}${picked&&!ok?'<span class="you">あなたが選択</span>':''}</div></div>`;
}
const oxStem=q=>q.topic.replace(/について$/,'')+'について';

/* ---------- state ---------- */
let S={v:1,mcq:{},ox:{},days:{},imported:false,mocks:[]};
let OWNER=false;
let store=null, saving=false, dirty=false;
const LS='jlpt-drill-v1';

/* ---------- ランキング（Googleスプレッドシートに保存） ----------
   ↓ Apps Script を「ウェブアプリ」としてデプロイしたときのURLを '' の中に貼る */
const RANK_URL='https://script.google.com/macros/s/AKfycbyOiDY8s2rXLenmLfPuwcHpbUg1aoaMwRSiKRr0U41k8MIxrNOJn8Op7H4r1KfxpAHZ/exec';
function rkGet(k){try{return localStorage.getItem(LS+'-'+k)}catch(e){return null}}
function rkSet(k,v){try{v==null?localStorage.removeItem(LS+'-'+k):localStorage.setItem(LS+'-'+k,v)}catch(e){}}
function myId(){let id=rkGet('uid');if(!id){id='';const c='abcdefghijklmnopqrstuvwxyz0123456789';const a=new Uint32Array(24);(crypto.getRandomValues?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.random()*1e9));a.forEach(n=>id+=c[n%36]);rkSet('uid',id)}return id}
function weekKey(d){d=d?new Date(d+'T00:00:00'):new Date();const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function myScore(){const t=totals();const wk=weekKey();let wn=0,wc=0;for(const k in S.days){if(weekKey(k)===wk){wn+=S.days[k].n;wc+=S.days[k].c}}const st=streakInfo();return{correct:t.c,total:t.n,wk,wc,wn,streak:st.cur,ld:st.today?today():dayStr(new Date(Date.now()-864e5)),bc:earnedIds().length}}
let rkTimer=null;
function sendScore(now){
  const nick=rkGet('nick'); if(!RANK_URL||!nick) return Promise.resolve();
  clearTimeout(rkTimer);
  const go=()=>fetch(RANK_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(Object.assign({action:'save',app:'jlpt',id:myId(),name:nick},myScore()))}).catch(()=>{});
  if(now) return go();
  rkTimer=setTimeout(go,2500); return Promise.resolve();
}

/* ---------- 連続日数 ---------- */
const dayStr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function streakInfo(){
  const set=new Set(Object.keys(S.days).filter(k=>S.days[k].n>0));
  const d=new Date(); const doneToday=set.has(dayStr(d)); if(!doneToday) d.setDate(d.getDate()-1);
  let cur=0; while(set.has(dayStr(d))){cur++;d.setDate(d.getDate()-1)}
  let best=0,run=0,prev=null;
  [...set].sort().forEach(k=>{const t=new Date(k+'T00:00:00');run=(prev&&Math.round((t-prev)/864e5)===1)?run+1:1;if(run>best)best=run;prev=t});
  return {cur,best:Math.max(best,cur),today:doneToday};
}

/* ---------- バッジ ---------- */
function lvAll(l){const qs=Q.filter(q=>q.lv===l);return qs.length>0&&qs.every(q=>S.mcq[q.id]&&S.mcq[q.id].c>0)}
function fieldAll(f){const qs=Q.filter(q=>q.field===f);return qs.length>0&&qs.every(q=>S.mcq[q.id]&&S.mcq[q.id].c>0)}
const BADGES=[
  {id:'first',e:'🌱',n:'はじめの一歩',d:'1問解く',f:x=>x.t.n>=1},
  {id:'c50',e:'📗',n:'50問正解',d:'累計50問正解',f:x=>x.t.c>=50},
  {id:'c100',e:'💯',n:'100問正解',d:'累計100問正解',f:x=>x.t.c>=100},
  {id:'c300',e:'🏅',n:'300問正解',d:'累計300問正解',f:x=>x.t.c>=300},
  {id:'c1000',e:'👑',n:'1000問正解',d:'累計1000問正解',f:x=>x.t.c>=1000},
  {id:'s3',e:'🔥',n:'3日連続',d:'3日続けて解く',f:x=>x.best>=3},
  {id:'s7',e:'⚡',n:'1週間連続',d:'7日続けて解く',f:x=>x.best>=7},
  {id:'s30',e:'🌟',n:'30日連続',d:'30日続けて解く',f:x=>x.best>=30},
  {id:'d20',e:'🎯',n:'1日20問正解',d:'1日で20問正解',f:x=>Object.values(S.days).some(d=>d.c>=20)},
  {id:'f1',e:'🎌',n:'N2制覇',d:'N2の問題を全問正解',f:()=>lvAll('N2')},
  {id:'f2',e:'🚀',n:'N1デビュー',d:'N1の問題で10問正解',f:()=>Q.filter(q=>q.lv==='N1').reduce((a,q)=>a+((S.mcq[q.id]&&S.mcq[q.id].c)?1:0),0)>=10},
  {id:'f3',e:'🗻',n:'N1制覇',d:'N1の問題を全問正解',f:()=>lvAll('N1')},
  {id:'m1',e:'📝',n:'模試デビュー',d:'模試を1回受ける',f:x=>x.mocks.length>=1},
  {id:'m2',e:'🎓',n:'模試合格',d:'模試で合格ライン突破',f:x=>x.mocks.some(m=>m.pass)},
  {id:'m3',e:'🏆',n:'模試90%',d:'N2かN1の模試で正答率90%以上',f:x=>x.mocks.some(m=>m.kind!=='mini'&&m.sc&&m.sc[0]>=m.sc[1]*0.9)}
];
function earnedIds(){const x={t:totals(),best:streakInfo().best,mocks:S.mocks||[]};return BADGES.filter(b=>{try{return b.f(x)}catch(e){return false}}).map(b=>b.id)}
let toastT=null;
function toast(html){
  let el=document.getElementById('toast'); if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}
  el.innerHTML=html; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{el.hidden=true},3200);
}
function checkBadges(){
  const now=earnedIds(); if(!S.badges){S.badges=now;return}
  const fresh=now.filter(id=>!S.badges.includes(id)); if(!fresh.length) return;
  S.badges=S.badges.concat(fresh); persist();
  const b=BADGES.find(x=>x.id===fresh[fresh.length-1]);
  toast('<span class="e">'+b.e+'</span>バッジ獲得！「'+esc(b.n)+'」'+(fresh.length>1?'（ほか'+(fresh.length-1)+'個）':''));
}
function badgeGrid(){
  const got=new Set(earnedIds());
  return '<div class="badges">'+BADGES.map(b=>'<div class="bdg '+(got.has(b.id)?'':'off')+'"><span class="e">'+b.e+'</span><b>'+esc(b.n)+'</b><span>'+esc(b.d)+'</span></div>').join('')+'</div>';
}

/* ---------- 模試 ---------- */
const MOCK_TYPES={
  n2:{label:'N2 模試',lv:'N2',per:{'漢字読み':5,'表記':4,'文脈規定':5,'言い換え類義':4,'用法':3,'文法':10,'読解':5},min:60},
  n1:{label:'N1 模試',lv:'N1',per:{'漢字読み':5,'表記':4,'文脈規定':5,'言い換え類義':4,'用法':3,'文法':10,'読解':5},min:60},
  mini:{label:'N2 ミニ模試',lv:'N2',per:{'漢字読み':3,'表記':2,'文脈規定':3,'言い換え類義':2,'用法':1,'文法':5,'読解':2},min:30}
};
const PASS=0.6;
let mock=null, mockTick=null, mockQuit=false;
try{const t=localStorage.getItem(LS+'-mock');if(t)mock=JSON.parse(t)}catch(e){}
function saveMock(){try{mock?localStorage.setItem(LS+'-mock',JSON.stringify(mock)):localStorage.removeItem(LS+'-mock')}catch(e){}}
function startMock(kind){
  const T=MOCK_TYPES[kind];
  const items=[].concat(...FIELDS.map(f=>shuffle(Q.filter(q=>q.field===f&&q.lv===T.lv)).slice(0,T.per[f]||0).map(q=>q.id)));
  mock={kind,items,sel:{},pos:0,start:Date.now(),limit:T.min*60000,result:null};
  mockQuit=false; saveMock(); go('mock');
}
function mockLeft(){return mock?Math.max(0,mock.start+mock.limit-Date.now()):0}
const fmtMs=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+pad(s%60)};
function gradeMock(){
  if(!mock||mock.result) return;
  const fs={}, sc=[0,0], marks=[];
  mock.items.forEach((id,i)=>{
    const q=QBY[id]; const you=(mock.sel[i]||[]).map(x=>x+1).sort((a,b)=>a-b);
    const ok=you.join()===q.ans.slice().sort((a,b)=>a-b).join();
    const f=fs[q.field]||(fs[q.field]=[0,0]); f[1]++; sc[1]++; if(ok){f[0]++; sc[0]++}
    marks.push(ok?1:0);
    if(!you.length) return;
    const r=S.mcq[id]||{n:0,c:0}; r.n++; if(ok) r.c++; r.last=ok; r.at=today(); S.mcq[id]=r;
    const d=S.days[today()]||{n:0,c:0}; d.n++; if(ok) d.c++; S.days[today()]=d;
  });
  const pass=sc[0]>=Math.ceil(sc[1]*PASS);
  const mins=Math.min(Math.ceil((Date.now()-mock.start)/60000),mock.limit/60000);
  mock.result={sc,fs,pass,mins,marks};
  S.mocks=(S.mocks||[]).concat([{at:today(),kind:mock.kind,sc,fs,pass,mins}]);
  saveMock(); persist(); updateBadge(); sendScore(); checkBadges();
}

async function persist(){

}

function record(kind,id,ok){
  const map=kind==='mcq'?S.mcq:S.ox;

}

function missList(){

function renderMcq(q,head){
  const need=q.ans.length;
  if(!sess.answered){
    view.innerHTML=`<div class="stack fade">${head}
     <p class="stem">${stemOf(q)}</p>
     <ul class="opts">${q.opts.map((o,i)=>`<li><div class="opt" role="button" tabindex="0" data-i="${i}" aria-pressed="${sess.sel.includes(i)}"><span class="n">${i+1}</span><span>${esc(o)}</span></div></li>`).join('')}</ul>
     <button class="btn" id="check" ${sess.sel.length===need?'':'disabled'}>答え合わせ</button>
    </div>`;
    view.querySelectorAll('.opt').forEach(b=>{
      const tog=e=>{if(e.target.closest('.term'))return;const i=+b.dataset.i;const k=sess.sel.indexOf(i);if(k>=0)sess.sel.splice(k,1);else{if(sess.sel.length>=need)sess.sel.shift();sess.sel.push(i)}renderQuiz()};
      b.addEventListener('click',tog);b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tog(e)}});
    });
    view.querySelector('#check').addEventListener('click',()=>{
      const you=sess.sel.map(i=>i+1).sort();const ok=you.join()===q.ans.slice().sort().join();
      sess.answered=true;sess.lastOk=ok;if(ok)sess.score++;record('mcq',q.id,ok);renderQuiz();window.scrollTo(0,0);

  const you=sess.sel.map(i=>i+1).sort((a,b)=>a-b);

function chartSvg(days){
  const W=360,H=200,L=34,R=6,T=20,B=26; const n=days.length; const bw=(W-L-R)/Math.max(n,1);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="日ごとの正答率">`;
  [0,50,100].forEach(v=>{const y=T+(H-T-B)*(1-v/100);s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-4}" y="${y+3}" text-anchor="end">${v}%</text>`});
  days.forEach((d,i)=>{const p=pct(d.c,d.n);const h=(H-T-B)*p/100;const x=L+i*bw+bw*.18;const w=bw*.64;const y=T+(H-T-B)-h;
    s+=`<rect class="b" x="${x}" y="${y}" width="${w}" height="${Math.max(h,1)}" rx="3"/>`;
    if(n<=10) s+=`<text class="lbl" x="${x+w/2}" y="${y-4}" text-anchor="middle">${p}</text>`;
    if(n<=7||i%2===(n-1)%2) s+=`<text x="${x+w/2}" y="${H-10}" text-anchor="middle">${esc(d.k.slice(5).replace('-','/').replace(/^0/,''))}</text>`});
  return s+'</svg>';
}

  if(!rkData) return [];
  let rows=rkData.slice();
  if(rkMode==='week'){const wk=weekKey();rows=rows.filter(r=>r.wk===wk&&r.wc>0).sort((a,b)=>b.wc-a.wc||b.wn-a.wn)}
  else if(rkMode==='streak'){rows=rows.map(r=>Object.assign({},r,{es:effStreak(r)})).filter(r=>r.es>0).sort((a,b)=>b.es-a.es||b.correct-a.correct)}
  else rows=rows.filter(r=>r.correct>0).sort((a,b)=>b.correct-a.correct||a.total-b.total);
  let rank=0,prev=null; return rows.map((r,i)=>{const v=rkMode==='week'?r.wc:rkMode==='streak'?r.es:r.correct;if(v!==prev){rank=i+1;prev=v}return Object.assign({rank},r)});
}
async function loadRank(){
  if(!RANK_URL) return;
  rkErr=false;
  try{await sendScore(true);const res=await fetch(RANK_URL+'?app=jlpt&me='+encodeURIComponent(myId())+'&t='+Date.now());const j=await res.json();rkData=j.rows||[]}
  catch(e){rkErr=true}
  if(tab==='rank') renderRank();
}
function renderRank(){
  if(!RANK_URL){view.innerHTML='<div class="stack fade"><h2>ランキング</h2><div class="panel empty">ランキングは準備中です。</div></div>';return}
  const nick=rkGet('nick')||'';
  const rows=rankRows(); const me=rows.find(r=>r.me);
  const list=rows.slice(0,50);
  const sc=myScore();
  view.innerHTML=`<div class="stack fade">
   <h2>ランキング</h2>
   <section class="panel stack" style="gap:8px">
    <p class="field-label" style="margin:0">ニックネーム（ランキングに表示されます）</p>
    <div class="row"><input class="search" id="nick" maxlength="12" placeholder="例：みかん太郎" value="${esc(nick)}" autocomplete="off"><button class="btn" id="nickSave" style="flex:none;width:auto">${nick?'変更':'参加する'}</button></div>
    <p class="note" style="margin:0">${nick?'正解するたびに自動でランキングに反映されます。':'ニックネームを決めると、正解数でみんなと競争できます。本名は入れないでね。'}</p>
   </section>
   <div class="seg">${[['all','累計正解'],['week','今週'],['streak','🔥連続日数']].map(([v,l])=>'<button data-rm="'+v+'" aria-pressed="'+(rkMode===v)+'">'+l+'</button>').join('')}</div>
   ${nick?`<div class="stat main"><div class="lab">あなた（${esc(nick)}）</div><div class="num">${me?me.rank+'<small> 位　</small>':''}${rkMode==='week'?sc.wc:rkMode==='streak'?sc.streak:sc.correct}<small>${rkMode==='streak'?' 日連続':' 問正解'}</small></div></div>`:''}
   ${rkErr?'<div class="panel empty">ランキングを読み込めませんでした。電波のよいところで「更新」を押してください。</div>':
     !rkData?'<div class="panel empty">読み込み中…</div>':
     list.length?'<ul class="rk">'+list.map(r=>{const v=rkMode==='week'?r.wc:rkMode==='streak'?r.es:r.correct,n=rkMode==='week'?r.wn:r.total;
       return `<li class="${r.me?'me':''}"><span class="no ${r.rank<=3?'g'+r.rank:''}">${r.rank}</span><span class="nm">${esc(r.name)}${r.me?'（あなた）':''}<small>${effStreak(r)?'🔥'+effStreak(r)+'日連続　':''}${r.bc?'🏅'+r.bc:''}</small></span><span class="sc"><b>${v}</b> ${rkMode==='streak'?'日':'問'}${rkMode==='streak'?'':'<span>正答率 '+pct(v,n)+'%</span>'}</span></li>`}).join('')+'</ul>'
     :'<div class="panel empty">まだだれもいません。一番乗りしよう！</div>'}
   <button class="btn ghost" id="rkReload">更新</button>
   ${nick?'<button class="btn ghost" id="rkLeave" style="font-size:.85rem">ランキングから外れる</button>':''}
   <p class="note" style="margin:0">今週は月曜日から日曜日までの集計です。</p>
  </div>`;
  view.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{rkMode=b.dataset.rm;renderRank()}));
  view.querySelector('#rkReload').addEventListener('click',()=>{rkData=null;renderRank();loadRank()});
  view.querySelector('#nickSave').addEventListener('click',()=>{
    const v=view.querySelector('#nick').value.replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,12);
    if(!v){view.querySelector('#nick').focus();return}
    rkSet('nick',v); rkData=null; renderRank(); loadRank();
  });
  const lv=view.querySelector('#rkLeave');
  if(lv) lv.addEventListener('click',async()=>{
    rkSet('nick',null); rkData=null; renderRank();
    try{await fetch(RANK_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'delete',app:'jlpt',id:myId()})})}catch(e){}
    setTimeout(loadRank,800);
  });
}
function renderMock(){
  if(!mock){view.innerHTML='<div class="panel empty fade">ホームの「模試モード」から始めてね。<br><br><button class="btn" id="h">ホームへ</button></div>';view.querySelector('#h').addEventListener('click',()=>go('home'));return}
  if(!mock.result&&mockLeft()<=0){gradeMock()}
  if(mock.result) return renderMockResult();
  const T=MOCK_TYPES[mock.kind], N=mock.items.length, i=mock.pos, q=QBY[mock.items[i]], need=q.ans.length, sel=mock.sel[i]||[];
  const answered=Object.keys(mock.sel).filter(k=>(mock.sel[k]||[]).length===QBY[mock.items[k]].ans.length).length;
  view.innerHTML=`<div class="stack fade">
   <div class="mockbar"><span>${T.label}　${i+1} / ${N}（${esc(FSHORT[q.field])}）</span><span>残り <span class="tm" id="tm">${fmtMs(mockLeft())}</span></span></div>
   <div class="progress"><i style="width:${answered/N*100}%"></i></div>
   <p class="stem">${stemOf(q)}</p>
   <ul class="opts">${q.opts.map((o,j)=>`<li><div class="opt" role="button" tabindex="0" data-j="${j}" aria-pressed="${sel.includes(j)}"><span class="n">${j+1}</span><span>${esc(o)}</span></div></li>`).join('')}</ul>
   <div class="row"><button class="btn ghost" id="mPrev" ${i?'':'disabled'}>前へ</button>${i+1<N?'<button class="btn" id="mNext">次へ</button>':'<button class="btn" id="mGrade">採点する</button>'}</div>
   <details class="rv"><summary>問題一覧（解答済み ${answered} / ${N}）</summary>
    <div class="qgrid">${mock.items.map((id,k)=>`<button data-k="${k}" class="${(mock.sel[k]||[]).length===QBY[id].ans.length?'done':''} ${k===i?'cur':''}">${k+1}</button>`).join('')}</div>
    <div class="row" style="margin-top:10px"><button class="btn" id="mGrade2">ここで採点する</button></div></details>
   <button class="btn ghost" id="mQuit" style="font-size:.85rem">${mockQuit?'もう一度押すと終了（この模試は記録されません）':'模試をやめる'}</button>
  </div>`;
  view.querySelectorAll('.opt').forEach(b=>{
    const tog=()=>{const j=+b.dataset.j;const a=(mock.sel[i]||[]).slice();const k=a.indexOf(j);if(k>=0)a.splice(k,1);else{if(a.length>=need)a.shift();a.push(j)}mock.sel[i]=a;saveMock();renderMock()};
    b.addEventListener('click',tog);b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tog()}});
  });
  const mv=d=>{mock.pos=Math.max(0,Math.min(N-1,mock.pos+d));mockQuit=false;saveMock();renderMock();window.scrollTo(0,0)};
  view.querySelector('#mPrev').addEventListener('click',()=>mv(-1));
  const nx=view.querySelector('#mNext'); if(nx) nx.addEventListener('click',()=>mv(1));
  view.querySelectorAll('.qgrid button').forEach(b=>b.addEventListener('click',()=>{mock.pos=+b.dataset.k;saveMock();renderMock();window.scrollTo(0,0)}));
  const gr=()=>{gradeMock();renderMock();window.scrollTo(0,0)};
  const g1=view.querySelector('#mGrade'); if(g1) g1.addEventListener('click',gr);
  view.querySelector('#mGrade2').addEventListener('click',gr);
  view.querySelector('#mQuit').addEventListener('click',()=>{if(!mockQuit){mockQuit=true;renderMock();return}mock=null;mockQuit=false;saveMock();go('home')});
  if(!mockTick) mockTick=setInterval(()=>{
    if(!mock||mock.result){clearInterval(mockTick);mockTick=null;return}
    const left=mockLeft(); const el=document.getElementById('tm');
    if(left<=0){clearInterval(mockTick);mockTick=null;gradeMock();if(tab==='mock'){renderMock();window.scrollTo(0,0)};toast('⏰ 時間になりました。採点しました');return}
    if(el){el.textContent=fmtMs(left);el.classList.toggle('low',left<5*60000)}
  },1000);
}
function renderMockResult(){
  const r=mock.result, T=MOCK_TYPES[mock.kind];
  const line=n=>Math.ceil(n*PASS);
  const secRow=(lab,s)=>`<tr><td>${lab}</td><td>${s[0]} / ${s[1]}</td><td>${pct(s[0],s[1])}%</td></tr>`;
  view.innerHTML=`<div class="stack fade">
   <h2>${T.label}の結果</h2>
   <div class="panel stack" style="gap:6px">
    <div class="pass ${r.pass?'ok':'ng'}">${r.pass?'🎉 合格ライン突破！':'あと少し！'}</div>
    <p class="note" style="margin:0;text-align:center">${r.sc[0]} / ${r.sc[1]}問正解（${pct(r.sc[0],r.sc[1])}%）　目安 ${line(r.sc[1])}問　かかった時間 ${r.mins}分</p>
    <div class="tw"><table class="wrap1"><thead><tr><th>問題の種類</th><th>正解</th><th>正答率</th></tr></thead><tbody>
     ${FIELDS.filter(f=>r.fs[f]).map(f=>secRow(FSHORT[f],r.fs[f])).join('')}</tbody></table></div>
    <p class="note" style="margin:0">本番は聴解もあり、得点区分ごとの基準点もあります。6割は練習の目安です。</p>
   </div>
   <h3 style="font-size:1rem">答え合わせ（タップで解説）</h3>
   <div class="stack" style="gap:6px">${mock.items.map((id,k)=>{const q=QBY[id],ok=r.marks[k],you=(mock.sel[k]||[]).map(x=>x+1).sort((a,b)=>a-b);
     return `<details class="rv"><summary>${ok?'⭕':'❌'} ${k+1}. ${esc(q.topic)}</summary>
      <div class="stack" style="gap:6px"><p class="note" style="margin:0">あなた：${you.length?you.join('と'):'未回答'}　正解：${q.ans.join('と')}</p>
      <p class="stem" style="margin:0">${stemOf(q)}</p>${q.opts.map((o,j)=>optRes(q,j,you.includes(j+1))).join('')}
      ${q.point?'<div class="point"><b>解説</b><br>'+hl(q.point)+'</div>':''}</div></details>`}).join('')}</div>
   <p class="note" style="margin:0">間違えた問題は「間違えた」タブにも入っています。</p>
   <div class="row"><button class="btn ghost" id="mMiss">間違えた問題へ</button><button class="btn" id="mHome">ホームへ</button></div>
  </div>`;
  const end=t=>{mock=null;saveMock();go(t)};
  view.querySelector('#mMiss').addEventListener('click',()=>end('miss'));
  view.querySelector('#mHome').addEventListener('click',()=>end('home'));
}
function renderWords(){
  view.innerHTML=`<div class="stack fade"><h2>文法メモ</h2>
   <input class="search" id="q" type="search" placeholder="文法をさがす（例：ならでは）" aria-label="文法をさがす">
   <dl class="gl" id="gl"></dl></div>`;
  const draw=f=>{document.getElementById('gl').innerHTML=Object.keys(GL).filter(k=>!f||k.includes(f)||GL[k].includes(f)).map(k=>`<div><dt>${esc(k)}</dt><dd>${esc(GL[k])}</dd></div>`).join('')||'<div class="empty">見つかりません</div>'};
  draw('');document.getElementById('q').addEventListener('input',e=>draw(e.target.value.trim()));
}

/* ---------- term sheet ---------- */
const sheet=document.getElementById('sheet');
document.addEventListener('click',e=>{
  const t=e.target.closest('.term'); if(!t) return;
  e.stopPropagation(); const k=t.dataset.term;
  sheet.innerHTML=`<div class="sheet-bg" id="sbg"></div><div class="sheet" role="dialog" aria-label="言葉の解説"><h3>${esc(k)}</h3><p>${esc(GL[k]||'')}</p><button class="btn" id="sclose">閉じる</button></div>`;
  sheet.hidden=false;
  const close=()=>{sheet.hidden=true;sheet.innerHTML=''};
  document.getElementById('sbg').addEventListener('click',close);document.getElementById('sclose').addEventListener('click',close);
  document.getElementById('sclose').focus();
},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheet.hidden){sheet.hidden=true;sheet.innerHTML=''}});

/* ---------- boot ---------- */
const local=lsLoad(); if(local) S=Object.assign(S,local);
if(!S.mocks) S.mocks=[]; if(!local) importHistory(); if(!S.badges) S.badges=earnedIds(); lsSave();
updateBadge(); render(); setSync('この端末に保存');
(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    OWNER=!!(await user.isOwner());
    const ref=db.doc('data/users/'+uid+'/progress');
    const snap=await ref.get();
    if(snap.exists){const d=snap.data();S=Object.assign({v:1,mcq:{},ox:{},days:{},imported:true,mocks:[]},JSON.parse(JSON.stringify(d)));if(!S.badges)S.badges=earnedIds();lsSave()}
    store=ref; setSync('保存済み');
    if(!snap.exists){ if(OWNER) importHistory(); persist(); }
    updateBadge(); if(tab!=='quiz'||!sess) render();
  }catch(e){setSync('この端末に保存')}
})();
})();
